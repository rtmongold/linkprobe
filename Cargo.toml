[workspace]
resolver = "2"
members = ["crates/linkprobe-core", "crates/linkprobe"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rtmongold/linkprobe"
authors = ["Robert Mongold rtmongold@gmail.com"]

[workspace.dependencies]
linkprobe-core = { path = "crates/linkprobe-core", version = "0.2.0" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
url = "2.5"
rumqttc = "0.25"
tiny_http = "0.12"